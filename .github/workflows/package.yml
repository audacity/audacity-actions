name: Package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-latest
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        architecture: x64
    - uses: actions/checkout@v6
      with:
        ref: conan2
    - run: npm install
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
